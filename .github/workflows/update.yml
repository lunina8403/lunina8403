name: V3 Dashboard Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # build activity block with workflow metadata
      # =========================
      - name: Build activity block
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "<!--START_ACTIVITY-->" > activity.txt
          echo "\`\`\`txt" >> activity.txt
          echo " [dashboard] Last update: ${TIMESTAMP}" >> activity.txt
          echo " [workflow] Run ID: $GITHUB_RUN_ID" >> activity.txt
          echo " [trigger] Event: $GITHUB_EVENT_NAME" >> activity.txt
          echo " [runner] $RUNNER_OS ($RUNNER_ARCH)" >> activity.txt
          echo "\`\`\`" >> activity.txt
          echo "<!--END_ACTIVITY-->" >> activity.txt

      # =========================
      # inject into README (SAFE REPLACE)
      # =========================
      - name: Inject activity
        run: |
          awk '
          /<!--START_ACTIVITY-->/ {
            print;
            while ((getline line < "activity.txt") > 0) {
              print line
            }
            skip=1
            next
          }
          /<!--END_ACTIVITY-->/ {
            skip=0
            print
            next
          }
          skip==1 { next }
          { print }
          ' README.md > tmp.md && mv tmp.md README.md

      # =========================
      # commit
      # ========================= 
      - name: Commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md activity.txt
          git commit -m "dashboard: refresh activity block" || exit 0
          git push origin HEAD:${{ github.ref_name }}
