name: Dashboard Update

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout repository
      # -------------------------
      - name: Checkout repo
        uses: actions/checkout@v3

      # -------------------------
      # Fetch / simulate activity
      # -------------------------
      - name: Fetch activity
        run: |
          # 写入简单的活动信息到 activity.txt
          echo "- system running" > activity.txt
          echo "- hyprland session active" >> activity.txt
          echo "- arch linux environment" >> activity.txt
          echo "- dotfiles-driven workflow online" >> activity.txt
          echo "- vim & terminal focused" >> activity.txt

      # -------------------------
      # Inject activity into README
      # -------------------------
      - name: Inject activity
        run: |
          echo "<!--START_ACTIVITY-->" > activity_block.txt
          echo "- system running" >> activity_block.txt
          echo "- hyprland session active" >> activity_block.txt
          echo "- arch linux environment" >> activity_block.txt
          echo "- dotfiles-driven workflow online" >> activity_block.txt
          echo "- vim & terminal focused" >> activity_block.txt
          echo "<!--END_ACTIVITY-->" >> activity_block.txt
          
          # 替换 README.md 中的占位符
          sed -i '/<!--START_ACTIVITY-->/,/<!--END_ACTIVITY-->/{
            r activity_block.txt
            d
          }' README.md

          rm activity_block.txt

      # -------------------------
      # Commit changes
      # -------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md activity.txt
          git commit -m "update dashboard" || exit 0
          git push
