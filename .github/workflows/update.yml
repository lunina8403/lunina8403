name: V3 Dashboard Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # build activity block (SAFE)
      # =========================
      - name: Build activity block
        run: |
          echo "<!--START_ACTIVITY-->" > activity.txt
          echo "- system running" >> activity.txt
          echo "- hyprland session active" >> activity.txt
          echo "- arch linux environment" >> activity.txt
          echo "- dotfiles-driven workflow online" >> activity.txt
          echo "- vim & terminal focused" >> activity.txt
          echo "<!--END_ACTIVITY-->" >> activity.txt

      # =========================
      # inject into README (SAFE REPLACE)
      # =========================
      - name: Inject activity
        run: |
          awk '
          /<!--START_ACTIVITY-->/ {
            print;
            while ((getline line < "activity.txt") > 0) {
              print line
            }
            skip=1
            next
          }
          /<!--END_ACTIVITY-->/ {
            skip=0
            print
            next
          }
          skip==1 { next }
          { print }
          ' README.md > tmp.md && mv tmp.md README.md

      # =========================
      # commit
      # =========================
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md activity.txt
          git commit -m "update dashboard" || exit 0
          git push
